[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "turnpike-solver"
version = "0.1.0"
description = "Reconstruct integer points on a line from their pairwise distances (the turnpike problem)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Justin Lyson"}]
dependencies = ["numpy", "scipy", "python-flint>=0.6", "highspy"]

[project.optional-dependencies]
fast = ["numba"]
test = ["pytest"]

[project.scripts]
turnpike = "turnpike.__main__:main"

[tool.setuptools.packages.find]
include = ["turnpike*"]
